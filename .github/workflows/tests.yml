name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, sqlite, pdo_sqlite, mbstring, bcmath, gd, zip
          coverage: none

      - name: Instalar dependencias de PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar el entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Comprobar el estilo del código
        run: ./vendor/bin/pint --test

      - name: Instalar y compilar los assets
        run: |
          npm ci
          npm run build

      - name: Ejecutar los tests
        run: php artisan test
